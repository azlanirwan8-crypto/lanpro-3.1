name: LanPro v1.5 CI/CD Pipeline (BNI Compliance Edition)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Tahap Audit & Quality Control
  test-and-scan:
    name: Pengujian & Pemindaian Keamanan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instal Dependensi
        run: npm install

      # Dijalankan SEBELUM lint. Pemeriksaan ini murah, cepat, dan menangkap
      # kelas kesalahan yang paling mahal bila lolos: rahasia ter-hardcode,
      # allowlist gitleaks yang membungkam dirinya sendiri, CORS terbuka lebar,
      # dan hilangnya pembatas laju pada endpoint autentikasi.
      #
      # Ditempatkan di depan agar tetap memberi sinyal meski tahap lint di
      # bawahnya masih merah (lihat ARCHITECTURE.md bagian 5.2).
      - name: Audit Konfigurasi & Keamanan (Doctor)
        run: npm run doctor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Validasi Kode (Lint & Type Check)
        run: npm run lint

      # Laporan ESLint dijalankan sebagai INFORMASI, belum sebagai penghalang.
      #
      # Codebase ini baru pertama kali di-lint dan menyisakan 32 error serta
      # 1.253 peringatan warisan. Menjadikannya penghalang hari ini membuat
      # pipeline merah total, dan sinyal yang selalu merah akan diabaikan orang
      # — persis nasib aturan tertulis di ARCHITECTURE.md selama ini.
      #
      # Penegakan untuk kode BARU sudah berjalan lewat lint-staged di pre-commit
      # hook, yang hanya memeriksa berkas yang benar-benar diubah. Ambang di
      # sini akan diturunkan bertahap seiring utangnya dilunasi (fase L3).
      - name: Laporan ESLint (belum memblokir)
        run: npm run lint:eslint || true
        continue-on-error: true

      # Menjalankan SELURUH suite, bukan satu berkas.
      #
      # Sebelumnya tahap ini hanya menjalankan src/tests/concurrency.test.ts,
      # sehingga 9 dari 10 suite tidak pernah dieksekusi di pipeline —
      # termasuk seluruh test render komponen dan test rute. Perubahan yang
      # merusak 72 dari 73 test akan lolos begitu saja ke main.
      - name: Menjalankan Seluruh Test Suite (Jest)
        run: npm test
        env:
          # Secret dipanggil hanya saat dibutuhkan oleh test runner
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Verifikasi Build Produksi
        run: npm run build

      - name: Pemindaian Rahasia (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Tahap Artifact Creation
  build-and-push:
    name: Artefak Build (Docker)
    needs: test-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/lanpro-app:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('lanpro-app:{0}', github.sha) }}

  # 3. Tahap Deployment dengan Approval Gate (Segregation of Duties - SoD)
  deploy:
    name: Deployment ke Produksi (Approval Required)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Kepatuhan BNI: Menggunakan Environment Produksi untuk memaksa jeda persetujuan manual (Required Reviewers)
    environment: 
      name: Production
      url: https://lanpro-bni-internal.bank
    steps:
      - name: Eksekusi SSH ke Server Produksi
        if: ${{ secrets.PROD_SERVER_IP != '' && secrets.PROD_SERVER_USER != '' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            echo "[DEVSECOP] Mengautentikasi rilis versi: ${{ github.sha }}"
            cd /opt/lanpro
            
            # Update tag image di docker-compose
            sed -i 's/lanpro-app:.*/lanpro-app:${{ github.sha }}/g' docker-compose.yml
            
            docker-compose pull
            
            # Rolling update: Update kontainer tanpa menghentikan layanan (Zero Downtime)
            docker-compose up -d --no-deps lanpro-backend
            
            # Pembersihan cache Docker lama
            docker system prune -f
            
            echo "[BNI-AUDIT] Rilis versi ${{ github.sha }} telah disebarkan dengan persetujuan manajerial."

      - name: Audit Status Deployment Produksi
        if: ${{ secrets.PROD_SERVER_IP == '' || secrets.PROD_SERVER_USER == '' }}
        run: |
          echo "[BNI-AUDIT] Build artifact versi ${{ github.sha }} disiapkan & terverifikasi 100% aman (Pre-Production Ready)."
          echo "[BNI-AUDIT] Untuk mengaktifkan auto-SSH deploy, isi PROD_SERVER_IP & PROD_SERVER_USER di GitHub Secrets."

      - name: Trigger Vercel Production Deployment
        run: |
          # Deploy hook adalah kredensial: siapa pun yang memilikinya bisa memicu
          # deploy produksi. Tidak boleh ada nilai fallback yang di-hardcode di sini.
          HOOK_URL="${{ secrets.VERCEL_DEPLOY_HOOK }}"
          if [ -z "$HOOK_URL" ]; then
            echo "[VERCEL-DEPLOY] Dilewati: secret VERCEL_DEPLOY_HOOK belum diset."
            exit 0
          fi
          echo "[VERCEL-DEPLOY] Memicu Vercel Auto-Deploy Hook..."
          curl -s -X POST "$HOOK_URL" > /dev/null
          echo "[VERCEL-DEPLOY] Hook Vercel berhasil dikirim."
