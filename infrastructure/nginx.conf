worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 100M;

    # --- Load Balancing Cluster ---
    upstream lanpro_app {
        # ip_hash memastikan user tetap di server yang sama (penting untuk Socket.io)
        ip_hash;
        server lanpro-backend:3000;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 100M;

        location / {
            proxy_pass http://lanpro_app;
            proxy_http_version 1.1;
            
            # --- Headers untuk Dukungan WebSocket & Real-time ---
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout lebih lama untuk koneksi socket yang idle
            proxy_read_timeout 86400;
        }

        # Health Check Endpoint
        location /api/health-check {
            proxy_pass http://lanpro_app;
        }
    }
}
