version: '3.8'

services:
  # --- LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lanpro-backend
    networks:
      - lanpro-network

  # --- BACKEND CLUSTER (High Availability) ---
  lanpro-backend:
    build: .
    deploy:
      replicas: 3
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
      - redis
    networks:
      - lanpro-network

  # --- REDIS (Socket.io State Sync) ---
  redis:
    image: redis:alpine
    networks:
      - lanpro-network

  # --- DATABASE (Persistence Layer) ---
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: lanpro_prod
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lanpro-network

networks:
  lanpro-network:
    driver: bridge

volumes:
  mysql_data:
