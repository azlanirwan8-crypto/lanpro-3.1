version: '3.8'

services:
  # --- LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lanpro-backend
    networks:
      - lanpro-network

  # --- BACKEND CLUSTER (High Availability) ---
  # NOTE: replicas: 3 only takes effect under `docker stack deploy` (Swarm mode);
  # a plain `docker compose up` runs a single instance of this service.
  lanpro-backend:
    build: .
    deploy:
      replicas: 3
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
    networks:
      - lanpro-network

  # --- REDIS (Socket.io State Sync) ---
  redis:
    image: redis:alpine
    networks:
      - lanpro-network

networks:
  lanpro-network:
    driver: bridge
